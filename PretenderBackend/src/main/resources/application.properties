spring.application.name=pretender-backend
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wms_integration}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sunbeam}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
pretender.upload-dir=uploads
pretender.works.provider=${PRETENDER_WORKS_PROVIDER:mock}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
