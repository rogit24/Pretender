<div class="page-heading"><div><p class="eyebrow">PRETENDER · PROCUREMENT</p><h1>Pre-Tender Details</h1><p class="subheading">Enter procurement details and configure the tender schedule.</p></div><span class="required-note"><b>*</b> Required fields</span></div>
<div class="tabs"><button class="tab" [class.active]="activeTab === 'add'" (click)="activeTab='add'" type="button">Add</button><a class="tab-link" routerLink="/pretender/tenders">View</a></div>
<form *ngIf="activeTab === 'add'" class="tender-form" #tenderForm="ngForm" (ngSubmit)="save()">
  <div class="form-grid">
    <fieldset class="field full-width procurement"><legend>Tender Type (Procurement) <b>*</b></legend><label class="radio-option"><input type="radio" name="procurementType" value="Open Tender" [(ngModel)]="tender.procurementType" required> Open Tender</label><label class="radio-option"><input type="radio" name="procurementType" value="Limited" [(ngModel)]="tender.procurementType"> Limited</label><label class="radio-option"><input type="radio" name="procurementType" value="Open Limited" [(ngModel)]="tender.procurementType"> Open Limited</label><label class="radio-option"><input type="radio" name="procurementType" value="National Competitive Bid (NCB)" [(ngModel)]="tender.procurementType"> National Competitive Bid (NCB)</label><label class="radio-option"><input type="radio" name="procurementType" value="Global Tender" [(ngModel)]="tender.procurementType"> Global Tender</label></fieldset>
    <label class="field"><span>Tender Reference Number <b>*</b></span><input name="tenderReferenceNumber" [(ngModel)]="tender.tenderReferenceNumber" required placeholder="Enter tender reference number"></label>
    <label class="field"><span>Tender Type <b>*</b></span><select name="tenderTypeId" [(ngModel)]="tender.tenderTypeId" required><option [ngValue]="null" disabled>Select tender type</option><option *ngFor="let option of list('tender-type')" [ngValue]="option.id">{{ option.name }}</option></select></label>
    <label class="field"><span>Number of Covers <b>*</b></span><select name="numberOfCoversId" [(ngModel)]="tender.numberOfCoversId" required><option [ngValue]="null" disabled>Select number of covers</option><option *ngFor="let option of list('number-of-covers')" [ngValue]="option.id">{{ option.name }}</option></select></label>
    <label class="field"><span>Tender Category <b>*</b></span><select name="tenderCategoryId" [(ngModel)]="tender.tenderCategoryId" required><option [ngValue]="null" disabled>Select tender category</option><option *ngFor="let option of list('tender-category')" [ngValue]="option.id">{{ option.name }}</option></select></label>
    <label class="field"><span>Work Item Product Category <b>*</b></span><select name="workItemProductCategoryId" [(ngModel)]="tender.workItemProductCategoryId" required><option [ngValue]="null" disabled>Select product category</option><option *ngFor="let option of list('work-item-product-category')" [ngValue]="option.id">{{ option.name }}</option></select></label>
    <label class="field"><span>Number of Bid Openers <b>*</b></span><select name="numberOfBidOpenersId" [(ngModel)]="tender.numberOfBidOpenersId" required><option [ngValue]="null" disabled>Select bid openers</option><option *ngFor="let option of list('number-of-bid-openers')" [ngValue]="option.id">{{ option.name }}</option></select></label>
    <label class="field"><span>Form of Contract <b>*</b></span><select name="formOfContractId" [(ngModel)]="tender.formOfContractId" required><option [ngValue]="null" disabled>Select contract form</option><option *ngFor="let option of list('form-of-contract')" [ngValue]="option.id">{{ option.name }}</option></select></label>
    <label class="field"><span>Bid Validity Days <b>*</b></span><input type="number" min="1" name="bidValidityDays" [(ngModel)]="tender.bidValidityDays" required placeholder="Enter days"></label>
    <label class="field span-2"><span>Document Description for Cover 1 <b>*</b></span><textarea name="cover1Description" [(ngModel)]="tender.cover1Description" required rows="2" placeholder="Describe the documents for cover 1"></textarea></label>
    <label class="field span-2"><span>Document Description for Cover 2</span><textarea name="cover2Description" [(ngModel)]="tender.cover2Description" rows="2" placeholder="Describe the documents for cover 2"></textarea></label>
    <label class="field"><span>Delivery Period Days <b>*</b></span><input type="number" min="1" name="deliveryPeriodDays" [(ngModel)]="tender.deliveryPeriodDays" required placeholder="Enter days"></label>
    <label class="field"><span>Tenderer Class <b>*</b></span><select name="tendererClassId" [(ngModel)]="tender.tendererClassId" required><option [ngValue]="null" disabled>Select tenderer class</option><option *ngFor="let option of list('tenderer-class')" [ngValue]="option.id">{{ option.name }}</option></select></label>
    <fieldset class="field choice-field"><legend>EMD Exemption <b>*</b></legend><label><input type="radio" name="emdExemption" [value]="true" [(ngModel)]="tender.emdExemption"> Yes</label><label><input type="radio" name="emdExemption" [value]="false" [(ngModel)]="tender.emdExemption"> No</label></fieldset>
    <fieldset class="field choice-field"><legend>Paper Cost Exemption <b>*</b></legend><label><input type="radio" name="paperCostExemption" [value]="true" [(ngModel)]="tender.paperCostExemption"> Yes</label><label><input type="radio" name="paperCostExemption" [value]="false" [(ngModel)]="tender.paperCostExemption"> No</label></fieldset>
    <label class="field"><span>Tender Fee</span><input type="number" min="0" step="0.01" name="tenderFee" [(ngModel)]="tender.tenderFee" placeholder="0.00"></label>
    <label class="field"><span>Tender EMD Fee</span><input type="number" min="0" step="0.01" name="tenderEmdFee" [(ngModel)]="tender.tenderEmdFee" placeholder="0.00"></label>
    <fieldset class="field choice-field"><legend>Pre Bid Meeting <b>*</b></legend><label><input type="radio" name="preBidMeeting" [value]="true" [(ngModel)]="tender.preBidMeeting"> Yes</label><label><input type="radio" name="preBidMeeting" [value]="false" [(ngModel)]="tender.preBidMeeting"> No</label></fieldset>
    <label class="field span-2"><span>Pre Bid Meeting Address</span><input name="preBidMeetingAddress" [(ngModel)]="tender.preBidMeetingAddress" placeholder="Enter meeting address"></label>
    <div class="section-divider full-width"><span>Tender Schedule</span></div>
    <label class="field"><span>Tender Publishing Date and Time <b>*</b></span><input type="datetime-local" name="tenderPublishingDateTime" [(ngModel)]="tender.tenderPublishingDateTime" required></label>
    <label class="field"><span>Document Download Start Date and Time <b>*</b></span><input type="datetime-local" name="documentDownloadStartDateTime" [(ngModel)]="tender.documentDownloadStartDateTime" required></label>
    <label class="field"><span>Seek Clarification Start Date and Time <b>*</b></span><input type="datetime-local" name="seekClarificationStartDateTime" [(ngModel)]="tender.seekClarificationStartDateTime" required></label>
    <label class="field"><span>Seek Clarification End Date and Time <b>*</b></span><input type="datetime-local" name="seekClarificationEndDateTime" [(ngModel)]="tender.seekClarificationEndDateTime" required></label>
    <label class="field"><span>Bid-Sub Start Date and Time <b>*</b></span><input type="datetime-local" name="bidSubmissionStartDateTime" [(ngModel)]="tender.bidSubmissionStartDateTime" required></label>
    <label class="field"><span>Bid-Sub End Date and Time <b>*</b></span><input type="datetime-local" name="bidSubmissionEndDateTime" [(ngModel)]="tender.bidSubmissionEndDateTime" required></label>
    <label class="field"><span>Bid Opening Date and Time <b>*</b></span><input type="datetime-local" name="bidOpeningDateTime" [(ngModel)]="tender.bidOpeningDateTime" required></label>
    <div class="section-divider full-width"><span>Documents</span></div>
    <label class="field"><span>Upload NIT File</span><input type="file" (change)="chooseFile($event, 'nitFileName')"><small *ngIf="tender.nitFileName">Selected: {{ tender.nitFileName }}</small></label>
    <label class="field"><span>Upload DTCN File</span><input type="file" (change)="chooseFile($event, 'dtcnFileName')"><small *ngIf="tender.dtcnFileName">Selected: {{ tender.dtcnFileName }}</small></label>
    <label class="field"><span>Upload Other File</span><input type="file" (change)="chooseFile($event, 'otherFileName')"><small *ngIf="tender.otherFileName">Selected: {{ tender.otherFileName }}</small></label>
  </div>
  <p class="feedback loading" *ngIf="mastersLoading">Loading dropdown values…</p>
  <p class="feedback error" *ngIf="error">{{ error }} <button class="retry-button" type="button" (click)="loadMasters()">Retry dropdowns</button></p><p class="feedback success" *ngIf="success">{{ success }}</p>
  <div class="form-actions"><button class="primary-button" type="submit" [disabled]="tenderForm.invalid">Save</button><button class="secondary-button" type="button" (click)="clear()">Cancel</button></div>
</form>
